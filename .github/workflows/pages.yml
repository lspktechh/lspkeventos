name: Publicar no GitHub Pages

# Build do site como exportação estática (pasta `out/`) e publicação no
# GitHub Pages. O domínio próprio é configurado em Settings → Pages (e o
# arquivo public/CNAME o acompanha). Pré-requisito, uma vez só: em
# Settings → Pages, "Source" = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Antes do build: informa o endereço onde o site vai ficar. Sem domínio
      # próprio é `/<repositório>` (github.io/<repositório>/); com domínio
      # próprio (Settings → Pages → Custom domain) é vazio. Basta rodar o
      # workflow de novo depois de configurar o domínio.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build (exportação estática)
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # HTTPS obrigatório: o site é uma página HTTPS e o navegador bloqueia
          # chamada a HTTP puro (mixed content). Para trocar o backend sem mexer
          # no código, defina a variável `API_URL` em Settings → Variables.
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'https://painel.lspk.com.br' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
